<style>

</head>

<body>

<div class="container">

```
<h1>🔗 QR Code Generator</h1>

<p class="subtitle">
    Convert any URL into a QR code
</p>

<label for="url">Enter Website URL</label>

<input
    type="text"
    id="url"
    placeholder="https://example.com"
>

<button onclick="generateQR()">
    Generate QR Code
</button>

<div class="qr-area" id="qrArea">

    <img id="qrImage" alt="QR Code">

    <br>

    <button class="download" onclick="downloadQR()">
        ⬇ Download QR Code
    </button>

    <button class="clear" onclick="clearQR()">
        Clear
    </button>

</div>

<div class="footer">
    Enter a URL and create your QR code instantly.
</div>
```

</div>

<script>

function generateQR() {

    let url = document.getElementById("url").value.trim();

    if (url === "") {
        alert("Please enter a URL first!");
        return;
    }

    // Automatically add https:// if needed
    if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
    }

    let qrImage = document.getElementById("qrImage");
    let qrArea = document.getElementById("qrArea");

    // QR Code API
    qrImage.src =
        "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="
        + encodeURIComponent(url);

    qrArea.style.display = "block";
}


function downloadQR() {

    let image = document.getElementById("qrImage");

    let link = document.createElement("a");

    link.href = image.src;
    link.download = "my-qr-code.png";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}


function clearQR() {

    document.getElementById("url").value = "";
    document.getElementById("qrArea").style.display = "none";
    document.getElementById("qrImage").src = "";

}

</script>

</body>
</html>
